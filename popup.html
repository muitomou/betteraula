<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Aula</title>
  <style>
    body {
      width: 300px;
      padding: 28px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      margin: 0;
      text-align: center;
      color: #1e293b;
    }

    .ba-icon {
      color: #3b82f6;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .ba-hint {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      font-size: 12px;
      color: #1e40af;
    }

    .ba-hint svg {
      flex-shrink: 0;
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Icono Better Aula (Lucide-style) -->
  <div class="ba-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18"/><path d="M9 21V9"/>
      <path d="M16 6l.5-1.5L18 4l-1.5-.5L16 2l-.5 1.5L14 4l1.5.5z" stroke-width="1.5"/>
    </svg>
  </div>

  <h2>Better Aula</h2>

  <p>
    El panel de configuración ahora vive dentro de Aula USM.<br>
    Accede directamente desde la barra de navegacion.
  </p>

  <div class="ba-hint">
    <!-- Arrow right icon -->
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
    <span>
      Haz clic en el icono de Better Aula en la esquina superior derecha de Aula.
    </span>
  </div>

</body>
</html>
